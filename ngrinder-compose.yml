version: '3.8'
services:
  ngrinder-controller:
    image: ngrinder/controller:3.5.9
    container_name: ngrinder-controller
    ports:
      - "8081:80"
      - "16001:16001"
    networks:
      default:
        aliases:
          - controller
    environment:
      - TZ=Asia/Seoul
    restart: unless-stopped

  ngrinder-agent:
    image: ngrinder/agent:3.5.9
    container_name: ngrinder-agent
    environment:
      - CONTROLLER_ADDR=ngrinder-controller:16001
      - TZ=Asia/Seoul
    depends_on:
      - ngrinder-controller
    restart: unless-stopped